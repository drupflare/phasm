# Every fact that decides the bytes of a built dependency: the source, the ref, and the configure
# line. Sourced by src/fetch-deps.sh, and hashed on its own into the CI cache key.
#
# SEPARATE FROM fetch-deps.sh ON PURPOSE. The cache key has to change when a dependency changes and
# stay put when the script's logic changes. Hashing the script conflates the two: three fixes to
# fetch-deps.sh -- the builder invocation, zlib's --static, and copying the extensions inside the
# container -- moved no dependency at all, and every one of them would have invalidated the cache.
#
# Edit a value here and the next CI run rebuilds that library. Edit fetch-deps.sh and it does not.

DEP_PREFIX=/src/lib/
DEP_CONFIG_CACHE=/tmp/config-cache

LIBXML2_REPO=https://gitlab.gnome.org/GNOME/libxml2.git
LIBXML2_REF=v2.9.10
LIBXML2_CONFIGURE="--with-http=no --with-ftp=no --with-python=no --with-threads=no"

LIBYAML_REPO=https://github.com/yaml/libyaml.git
LIBYAML_REF=0.2.5
LIBYAML_CONFIGURE="--enable-shared=no --enable-static=yes"

# --static is required rather than optional: without it zlib builds libz.so and links two test
# programs against it, and wasm-ld rejects a .so with "unknown file type"
ZLIB_REPO=https://github.com/madler/zlib.git
ZLIB_REF=v1.3.1
ZLIB_CONFIGURE="--static"

# iconv is fetched only for the iconv variant; measured, it lands 386,808 bytes over the free
# ceiling and does not fix mb_substr()
#
# Tried in order, and the checksum is what makes a mirror safe to fall back to. ftpmirror.gnu.org
# is absent on purpose: it does not carry libiconv, on either /libiconv or /gnu/libiconv.
LIBICONV_VERSION=1.17
LIBICONV_URLS="https://ftp.gnu.org/pub/gnu/libiconv/libiconv-1.17.tar.gz
https://mirrors.kernel.org/gnu/libiconv/libiconv-1.17.tar.gz"
LIBICONV_SHA256=8f74213b56238c85a50a5329f77e06198771e70dd9a739779f4c02f65d971313
LIBICONV_CONFIGURE="--enable-shared=no --enable-static=yes"

# PHP extensions, copied into php-src/ext/ rather than linked as libraries
VRZNO_REPO=https://github.com/seanmorris/vrzno.git
VRZNO_REF=c3aa3b9

YAML_EXT_VERSION=2.3.0
YAML_EXT_URLS="https://pecl.php.net/get/yaml-2.3.0.tgz"
YAML_EXT_SHA256=bc8404807a3a4dc896b310af21a7f8063aa238424ff77f27eb6ffa88b5874b8a
